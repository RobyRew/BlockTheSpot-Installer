name: Download page
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/test-site.mjs', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'scripts/test-site.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate official download links and page
        run: node --test scripts/test-site.mjs
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@v5
